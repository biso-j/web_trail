name: Deploy Jaspr to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if needed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Jaspr
        run: |
          flutter pub global activate jaspr_cli ^0.24.0-beta.2
          jaspr build --verbose

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/jaspr'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4